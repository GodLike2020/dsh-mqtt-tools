name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run check

      # protocol / lifecycle / perf / ui: no DSH GUI, no credentials, no network.
      # The suites that talk to a live GUI (api-tools, interop, resilience) are
      # skipped here on purpose; run them locally with DSH_BASE set.
      - run: npm run test:offline
